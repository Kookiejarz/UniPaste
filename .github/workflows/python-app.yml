name: Release UniPaste

on:
  push:
    tags:
      - 'v*'

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from config import ReleaseConfig

          print(f"matrix={json.dumps({'include': ReleaseConfig.get_build_matrix()})}")
          PY

  build:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create icon directory if needed
        if: matrix.platform == 'macos'
        shell: bash
        run: mkdir -p assets

      - name: Build macOS application
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cat > unipaste.spec <<'PYI'
          # -*- mode: python -*-
          block_cipher = None

          a = Analysis(
              ['mac_clip_check.py'],
              pathex=[],
              binaries=[],
              datas=[('LICENSE', '.'), ('utils', 'utils'), ('handlers', 'handlers'), ('config.py', '.'), ('unipaste.png', '.')],
              hiddenimports=[
                  'AppKit',
                  'tkinter',
                  'tkinter.ttk',
                  'websockets',
                  'cryptography',
                  'pyperclip',
                  'utils.security.crypto',
                  'utils.security.auth',
                  'utils.security.pairing',
                  'utils.network.discovery',
                  'utils.message_format',
                  'utils.platform_config',
                  'utils.clipboard_utils',
                  'utils.control_panel',
                  'utils.service_host',
                  'utils.autostart',
                  'handlers.file_handler',
                  'config',
              ],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              win_no_prefer_redirects=False,
              win_private_assemblies=False,
              cipher=block_cipher,
              noarchive=False,
          )
          pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.zipfiles,
              a.datas,
              [],
              name='UniPaste-Mac',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              upx_exclude=[],
              runtime_tmpdir=None,
              console=False,
              disable_windowed_traceback=False,
              argv_emulation=True,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
          )
          PYI

          pyinstaller unipaste.spec

      - name: Build Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >
          pyinstaller --onefile --windowed --name "${{ matrix.executable_name }}"
          "${{ matrix.entry_script }}"
          --add-data "utils;utils"
          --add-data "handlers;handlers"
          --add-data "config.py;."
          --add-data "unipaste.png;."
          --hidden-import="pywin32"
          --hidden-import="win32clipboard"
          --hidden-import="win32con"
          --hidden-import="win32com.shell"
          --hidden-import="pythoncom"
          --hidden-import="pyperclip"
          --hidden-import="pystray"
          --hidden-import="PIL.Image"
          --hidden-import="PIL.ImageDraw"
          --hidden-import="tkinter"
          --hidden-import="tkinter.ttk"
          --hidden-import="websockets"
          --hidden-import="cryptography"
          --hidden-import="zeroconf"
          --hidden-import="netifaces"
          --hidden-import="utils.security.crypto"
          --hidden-import="utils.security.auth"
          --hidden-import="utils.security.pairing"
          --hidden-import="utils.network.discovery"
          --hidden-import="utils.message_format"
          --hidden-import="utils.platform_config"
          --hidden-import="utils.clipboard_utils"
          --hidden-import="utils.control_panel"
          --hidden-import="utils.service_host"
          --hidden-import="utils.windows_tray"
          --hidden-import="handlers.file_handler"
          --hidden-import="config"

      - name: Package macOS artifact
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          release_dir="release/${{ matrix.release_dir }}"
          mkdir -p "$release_dir"
          cp "dist/${{ matrix.executable_name }}" "$release_dir/"
          cp README.md "$release_dir/" || echo "README.md not found"
          cp LICENSE "$release_dir/" || echo "LICENSE not found"
          chmod +x "$release_dir/${{ matrix.executable_name }}"

      - name: Package Windows artifact
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $releaseDir = "release/${{ matrix.release_dir }}"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item "dist/${{ matrix.executable_name }}.exe" "$releaseDir/"
          if (Test-Path README.md) { Copy-Item README.md "$releaseDir/" } else { Write-Host "README.md not found" }
          if (Test-Path LICENSE) { Copy-Item LICENSE "$releaseDir/" } else { Write-Host "LICENSE not found" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.release_dir }}/

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create ZIP archives
        shell: bash
        run: |
          cd release
          for dir in */; do
            name="${dir%/}"
            zip -r "${name}.zip" "$name"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.zip
          draft: false
          prerelease: false
